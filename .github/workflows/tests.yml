# Тесты на каждый push и pull request.
#
# Зачем: 578 тестов гонялись только вручную, поэтому поломка спокойно доезжала
# до Render и обнаруживалась уже как «бот молчит». Здесь она видна до деплоя.
#
# Playwright-браузер намеренно не ставится: он весит ~150 МБ и нужен только
# браузерному пути публикации, который в тестах замокан. Прогон остаётся быстрым.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Та же версия, что на Render (backend/runtime.txt).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Тесты
        # Ключи из окружения не должны подмешиваться: тест, случайно ходящий
        # в реальный API, красный по чужой причине и зелёный по случайности.
        env:
          ADMIN_PASSWORD: ci-test-password
        run: pytest -q
