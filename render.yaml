services:
  - type: web
    name: nexus-ai
    runtime: python
    rootDir: backend
    # Фронт уже собран и закоммичен (frontend/dist) — npm не нужен.
    # Сборка только Python: лёгкая и не падает.
    # Лёгкая сборка: локальный Chromium НЕ ставим — браузер удалённый (CDP),
    # чтобы не грузить инстанс 512 МБ. Playwright из requirements нужен только
    # для сетевого подключения к облачному браузеру.
    buildCommand: pip install -r requirements.txt
    # Перед стартом накатываем миграции: схема БД всегда актуальна.
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # ПОСТОЯННАЯ БД (Supabase Postgres) — без неё данные теряются при рестарте.
      # Строка вида postgresql://user:pass@host:5432/postgres — код сам переведёт на asyncpg.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Бесплатные провайдеры — любой из них включает исполнителя без оплаты.
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GITHUB_MODELS_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      # Публикация (официальные API площадок; браузер-агент — fallback)
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      # OAuth Meta: подключение Instagram и продление токена
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: THREADS_ACCESS_TOKEN
        sync: false
      - key: THREADS_USER_ID
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_OAUTH_JSON
        sync: false
      # Анализ аккаунтов (бесплатно: yt-dlp; Instagram — опц. Bright Data)
      - key: IG_HANDLE
        sync: false
      - key: TIKTOK_HANDLE
        sync: false
      - key: YOUTUBE_HANDLE
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      # Публикация без API — через УДАЛЁННЫЙ браузер (онлайн, без ПК, не грузит Render)
      - key: NEXUS_PUBLISH_MODE
        value: auto
      - key: NEXUS_SERVER_BROWSER
        value: "1"
      # Анализ без API: auto (сервисы→браузер) | browser | api
      - key: NEXUS_ANALYZE_MODE
        value: auto
      # Эндпоинт облачного браузера (Bright Data Scraping Browser: wss://...@...:9222)
      - key: NEXUS_BROWSER_CDP
        sync: false
      # Опц.: cookies для входа в аккаунты (storage_state JSON или путь)
      - key: NEXUS_BROWSER_STORAGE_STATE
        sync: false
