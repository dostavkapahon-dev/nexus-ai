services:
  - type: web
    name: nexus-ai
    runtime: python
    rootDir: backend
    # Фронт уже собран и закоммичен (frontend/dist) — npm не нужен.
    #
    # Chromium по умолчанию НЕ ставим. На инстансе с 512 МБ он всё равно не
    # запустится: ядро убивает процесс целиком, и сервис падает по кругу вместе
    # с ботом. Занимать ~150 МБ сборки ради заведомо нерабочего пути незачем.
    #
    # Браузер нужен — два пути, оба без нагрузки на этот сервис:
    #   • облачный браузер: задать NEXUS_BROWSER_CDP (см. docs/BROWSER.md);
    #   • отдельный сервис с большей памятью: там NEXUS_INSTALL_CHROMIUM=1.
    buildCommand: |
      pip install -r requirements.txt
      if [ "$NEXUS_INSTALL_CHROMIUM" = "1" ]; then
        mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
        python -m playwright install chromium > /tmp/pw_install.log 2>&1 || (echo "ВНИМАНИЕ: Chromium не установлен"; tail -20 /tmp/pw_install.log; tail -20 /tmp/pw_install.log > "$PLAYWRIGHT_BROWSERS_PATH/.install_error")
      else
        echo "Chromium не ставится: NEXUS_INSTALL_CHROMIUM не равен 1 (см. docs/BROWSER.md)"
      fi
    #
    # Миграции тоже не должны быть единой точкой отказа: при `&&` любая неудача
    # означала, что сервис не поднимется вовсе и причину видно только в логах
    # сборки. Теперь результат миграции запоминается и виден в /api/health,
    # а приложение стартует и может о себе рассказать.
    startCommand: |
      (alembic upgrade head && echo ok > /tmp/nexus_migration || echo "FAILED" > /tmp/nexus_migration)
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Куда Playwright кладёт Chromium. Задано ЯВНО и одинаково для сборки и
      # запуска: по умолчанию путь берётся из домашней папки, а она у этих двух
      # этапов на Render разная — браузер скачивался в одно место, а искался в
      # другом, и статус честно показывал «не установлен». Каталог лежит внутри
      # проекта, поэтому переживает переход от сборки к запуску.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
      # ПОСТОЯННАЯ БД (Supabase Postgres) — без неё данные теряются при рестарте.
      # Строка вида postgresql://user:pass@host:5432/postgres — код сам переведёт на asyncpg.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Ключ шифрования сохранённых доступов. Пока он не задан, ключи площадок
      # лежат в базе открытым текстом. Задайте любую длинную строку — и НЕ теряйте
      # её: без неё зашифрованные значения прочитать нельзя, их придётся ввести заново.
      - key: NEXUS_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Бесплатные провайдеры — любой из них включает исполнителя без оплаты.
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GITHUB_MODELS_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HIGGSFIELD_MCP_URL
        sync: false
      - key: HIGGSFIELD_MCP_TOKEN
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      # Публикация (официальные API площадок; браузер-агент — fallback)
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      # OAuth Meta: подключение Instagram и продление токена
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: THREADS_ACCESS_TOKEN
        sync: false
      - key: THREADS_USER_ID
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_OAUTH_JSON
        sync: false
      # Анализ аккаунтов (бесплатно: yt-dlp; Instagram — опц. Bright Data)
      - key: IG_HANDLE
        sync: false
      - key: TIKTOK_HANDLE
        sync: false
      - key: YOUTUBE_HANDLE
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      # Публикация без API — через УДАЛЁННЫЙ браузер (онлайн, без ПК, не грузит Render)
      - key: NEXUS_PUBLISH_MODE
        value: auto
      - key: NEXUS_SERVER_BROWSER
        value: "1"
      # Анализ без API: auto (сервисы→браузер) | browser | api
      - key: NEXUS_ANALYZE_MODE
        value: auto
      # Эндпоинт облачного браузера (Bright Data Scraping Browser: wss://...@...:9222)
      - key: NEXUS_BROWSER_CDP
        sync: false
      # Ставить ли Chromium в этот сервис. На 512 МБ он не запустится — держите
      # пустым и пользуйтесь облачным браузером или отдельным сервисом.
      - key: NEXUS_INSTALL_CHROMIUM
        sync: false
      # Сколько памяти должно быть свободно, чтобы вообще пробовать запуск.
      # Ниже порога канал честно откажет, а не уронит сервис.
      - key: NEXUS_BROWSER_MIN_MB
        value: "300"
      # Поиск, не зависящий от квоты Gemini (бесплатный тариф brave.com/search/api)
      - key: BRAVE_API_KEY
        sync: false
      # Cookies для входа в аккаунты. Обычно задаются НЕ здесь, а в дашборде:
      # Ключи API → Браузерная сессия (принимается экспорт расширения как есть).
      - key: NEXUS_BROWSER_STORAGE_STATE
        sync: false
